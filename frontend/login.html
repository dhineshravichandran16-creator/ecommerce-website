<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Login - ShopHub</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .login-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #a29bfe, #6c5ce7);
      padding: 2rem;
    }
    .login-card {
      background: #fff;
      padding: 2.5rem;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.25);
      width: 100%;
      max-width: 400px;
    }
    .login-card h2 {
      text-align: center;
      color: #2d3436;
      margin-bottom: 0.5rem;
    }
    .login-card p {
      text-align: center;
      color: #888;
      margin-bottom: 1.5rem;
      font-size: 0.9rem;
    }
    .form-group {
      margin-bottom: 1rem;
    }
    .form-group label {
      display: block;
      margin-bottom: 0.4rem;
      font-weight: 600;
      color: #2d3436;
      font-size: 0.9rem;
    }
    .form-group input {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 2px solid #f4f6fb;
      border-radius: 10px;
      font-size: 1rem;
      outline: none;
      transition: 0.3s;
    }
    .form-group input:focus {
      border-color: #6c5ce7;
      background: #fafbff;
    }
    .login-btn {
      width: 100%;
      padding: 0.9rem;
      background: #6c5ce7;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 1rem;
      transition: 0.3s;
    }
    .login-btn:hover { background: #5f4dd0; }
    .toggle-link {
      text-align: center;
      margin-top: 1.5rem;
      color: #888;
      font-size: 0.9rem;
    }
    .toggle-link span {
      color: #6c5ce7;
      cursor: pointer;
      font-weight: 600;
    }
    .remember-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      color: #888;
    }
    .remember-row label {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      cursor: pointer;
    }
    .brand {
      text-align: center;
      font-size: 2rem;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>

  <div class="login-page">
    <div class="login-card">
      <div class="brand">🛍️</div>
      <h2 id="form-title">Sign in</h2>
      <p id="form-subtitle">Welcome back! Please enter your details.</p>

      <form id="auth-form">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="email" placeholder="you@example.com" required />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" placeholder="Enter your password" required />
        </div>

        <div class="remember-row" id="remember-row">
          <label>
            <input type="checkbox" /> Remember me
          </label>
          <span style="color:#6c5ce7;cursor:pointer;">Forgot password?</span>
        </div>

        <button type="submit" class="login-btn" id="submit-btn">Sign in</button>
      </form>

      <div class="toggle-link">
        <span id="toggle-text">Don't have an account?</span>
        <span id="toggle-btn">Sign up</span>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    let isSignup = false;

    const formTitle = document.getElementById('form-title');
    const formSubtitle = document.getElementById('form-subtitle');
    const submitBtn = document.getElementById('submit-btn');
    const toggleText = document.getElementById('toggle-text');
    const toggleBtn = document.getElementById('toggle-btn');
    const rememberRow = document.getElementById('remember-row');
    const authForm = document.getElementById('auth-form');

    toggleBtn.addEventListener('click', () => {
      isSignup = !isSignup;
      if (isSignup) {
        formTitle.textContent = 'Create account';
        formSubtitle.textContent = 'Join ShopHub today!';
        submitBtn.textContent = 'Sign up';
        toggleText.textContent = 'Already have an account?';
        toggleBtn.textContent = 'Sign in';
        rememberRow.style.display = 'none';
      } else {
        formTitle.textContent = 'Sign in';
        formSubtitle.textContent = 'Welcome back! Please enter your details.';
        submitBtn.textContent = 'Sign in';
        toggleText.textContent = "Don't have an account?";
        toggleBtn.textContent = 'Sign up';
        rememberRow.style.display = 'flex';
      }
    });

    authForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const endpoint = isSignup ? '/signup' : '/login';

      try {
        const res = await fetch(`${API_URL}${endpoint}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();

        if (data.success) {
          localStorage.setItem('user', JSON.stringify(data.user));
          showToast(data.message);
          setTimeout(() => location.href = 'index.html', 800);
        } else {
          alert(data.message || 'Something went wrong');
        }
      } catch (err) {
        alert('Login failed. Check your backend server.');
      }
    });
  </script>
</body>
</html>
