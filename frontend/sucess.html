<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Order Placed - ShopHub</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .success-page {
      min-height: 80vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .success-card {
      background: #fff;
      padding: 3rem 2.5rem;
      border-radius: 20px;
      text-align: center;
      max-width: 500px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.1);
    }
    .success-icon {
      font-size: 4rem;
      margin-bottom: 1rem;
      animation: bounce 0.6s;
    }
    @keyframes bounce {
      0% { transform: scale(0); }
      60% { transform: scale(1.15); }
      100% { transform: scale(1); }
    }
    .success-card h1 {
      color: #00b894;
      margin-bottom: 0.5rem;
    }
    .success-card p {
      color: #888;
      margin-bottom: 1.5rem;
    }
    .order-id {
      background: #f4f6fb;
      padding: 1rem;
      border-radius: 10px;
      font-weight: 600;
      color: #6c5ce7;
      margin-bottom: 1.5rem;
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="logo">🛍️ ShopHub</div>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="products.html">Products</a></li>
    </ul>
  </nav>

  <div class="success-page">
    <div class="success-card">
      <div class="success-icon">🎉</div>
      <h1>Order Placed!</h1>
      <p>Thank you for shopping with ShopHub.</p>
      <div class="order-id" id="order-id">Order ID: —</div>
      <p>Your order will be delivered in 3-5 business days.</p>
      <button class="btn-primary" onclick="location.href='products.html'" style="margin-top:1rem;">
        Continue Shopping
      </button>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const lastOrder = JSON.parse(localStorage.getItem('lastOrder')) || {};
      if (lastOrder.orderId) {
        document.getElementById('order-id').textContent = 'Order ID: ' + lastOrder.orderId;
      }
    });
  </script>
</body>
</html>
