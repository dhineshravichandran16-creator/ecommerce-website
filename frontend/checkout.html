<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Checkout - ShopHub</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .checkout-grid {
      display: grid;
      grid-template-columns: 1.5fr 1fr;
      gap: 2rem;
      padding: 2rem 0;
    }
    .checkout-box {
      background: #fff;
      padding: 2rem;
      border-radius: 15px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.05);
    }
    .checkout-box h3 {
      margin-bottom: 1.5rem;
      color: #2d3436;
    }
    .form-group {
      margin-bottom: 1rem;
    }
    .form-group label {
      display: block;
      margin-bottom: 0.4rem;
      font-weight: 600;
      color: #2d3436;
      font-size: 0.9rem;
    }
    .form-group input,
    .form-group select {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 2px solid #f4f6fb;
      border-radius: 10px;
      font-size: 1rem;
      outline: none;
      transition: 0.3s;
      font-family: inherit;
    }
    .form-group input:focus,
    .form-group select:focus {
      border-color: #6c5ce7;
      background: #fafbff;
    }
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }
    .order-item {
      display: flex;
      justify-content: space-between;
      padding: 0.6rem 0;
      border-bottom: 1px solid #f4f6fb;
      font-size: 0.95rem;
    }
    .order-total {
      display: flex;
      justify-content: space-between;
      padding-top: 1rem;
      font-size: 1.3rem;
      font-weight: bold;
      color: #6c5ce7;
    }
    .place-order-btn {
      width: 100%;
      padding: 1rem;
      background: #00b894;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 1.5rem;
      transition: 0.3s;
    }
    .place-order-btn:hover { background: #019d7a; }
    @media (max-width: 768px) {
      .checkout-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="logo">🛍️ ShopHub</div>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="products.html">Products</a></li>
      <li>
        <div class="cart-icon" onclick="location.href='cart.html'">
          🛒 <span class="badge" id="cart-count">0</span>
        </div>
      </li>
    </ul>
  </nav>

  <div class="container">
    <h2 class="section-title">Check<span>out</span></h2>

    <div class="checkout-grid">

      <!-- LEFT: FORM -->
      <div class="checkout-box">
        <h3>📦 Shipping Details</h3>
        <form id="checkout-form">
          <div class="form-row">
            <div class="form-group">
              <label>First Name</label>
              <input type="text" id="fname" required />
            </div>
            <div class="form-group">
              <label>Last Name</label>
              <input type="text" id="lname" required />
            </div>
          </div>
          <div class="form-group">
            <label>Email</label>
            <input type="email" id="email" required />
          </div>
          <div class="form-group">
            <label>Phone</label>
            <input type="tel" id="phone" required />
          </div>
          <div class="form-group">
            <label>Address</label>
            <input type="text" id="address" required />
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>City</label>
              <input type="text" id="city" required />
            </div>
            <div class="form-group">
              <label>Pincode</label>
              <input type="text" id="pincode" required />
            </div>
          </div>

          <h3 style="margin-top:2rem;">💳 Payment Method</h3>
          <div class="form-group">
            <select id="payment">
              <option value="cod">Cash on Delivery</option>
              <option value="card">Credit / Debit Card</option>
              <option value="upi">UPI</option>
            </select>
          </div>
        </form>
      </div>

      <!-- RIGHT: ORDER SUMMARY -->
      <div class="checkout-box">
        <h3>🧾 Order Summary</h3>
        <div id="order-items"></div>
        <div class="order-total">
          <span>Total:</span>
          <span id="order-total">$0.00</span>
        </div>
        <button class="place-order-btn" onclick="placeOrder()">Place Order</button>
      </div>

    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    function renderCheckout() {
      const cart = getCart();
      const itemsDiv = document.getElementById('order-items');
      const totalDiv = document.getElementById('order-total');

      if (cart.length === 0) {
        itemsDiv.innerHTML = '<p style="color:#888;">Your cart is empty.</p>';
        totalDiv.textContent = '$0.00';
        return;
      }

      let total = 0;
      itemsDiv.innerHTML = cart.map(item => {
        total += item.price * item.quantity;
        return `
          <div class="order-item">
            <span>${item.name} × ${item.quantity}</span>
            <span>$${(item.price * item.quantity).toFixed(2)}</span>
          </div>
        `;
      }).join('');

      totalDiv.textContent = `$${total.toFixed(2)}`;
    }

    async function placeOrder() {
      const cart = getCart();
      if (cart.length === 0) {
        alert('Your cart is empty!');
        return;
      }

      const form = document.getElementById('checkout-form');
      if (!form.checkValidity()) {
        form.reportValidity();
        return;
      }

      const total = cart.reduce((s, i) => s + i.price * i.quantity, 0);

      const orderData = {
        customer: {
          name: document.getElementById('fname').value + ' ' + document.getElementById('lname').value,
          email: document.getElementById('email').value,
          phone: document.getElementById('phone').value,
          address: document.getElementById('address').value + ', ' + document.getElementById('city').value + ' - ' + document.getElementById('pincode').value
        },
        items: cart,
        total,
        payment: document.getElementById('payment').value
      };

      try {
        const res = await fetch(`${API_URL}/checkout`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(orderData)
        });
        const data = await res.json();

        if (data.success) {
          localStorage.setItem('lastOrder', JSON.stringify({ ...orderData, orderId: data.orderId }));
          localStorage.removeItem('cart');
          location.href = 'success.html';
        } else {
          alert('Order failed. Try again.');
        }
      } catch (err) {
        alert('Cannot reach server. Make sure backend is running.');
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      updateCartCount();
      renderCheckout();
    });
  </script>
</body>
</html>
