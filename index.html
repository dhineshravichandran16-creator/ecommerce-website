<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ShopHub - Home</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="logo">🛍️ ShopHub</div>
    <div class="search-bar">
      <input type="text" placeholder="Search products..." />
    </div>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="products.html">Products</a></li>
      <li><a href="admin.html">Admin</a></li>
      <li><a href="login.html">Login</a></li>
      <li>
        <div class="cart-icon" onclick="location.href='cart.html'">
          🛒 <span class="badge" id="cart-count">0</span>
        </div>
      </li>
    </ul>
  </nav>

  <!-- HERO -->
  <section class="hero">
    <h1>Fresh & Healthy Food Delivered</h1>
    <p>Get 50% OFF on your first order</p>
    <button onclick="location.href='products.html'">Shop Now</button>
  </section>

  <!-- CATEGORIES -->
  <section class="categories">
    <div class="category-card" onclick="location.href='products.html'">
      <div class="icon">🍎</div>
      <p>Fruits</p>
    </div>
    <div class="category-card" onclick="location.href='products.html'">
      <div class="icon">🥦</div>
      <p>Vegetables</p>
    </div>
    <div class="category-card" onclick="location.href='products.html'">
      <div class="icon">🍞</div>
      <p>Bakery</p>
    </div>
    <div class="category-card" onclick="location.href='products.html'">
      <div class="icon">🥤</div>
      <p>Beverages</p>
    </div>
    <div class="category-card" onclick="location.href='products.html'">
      <div class="icon">🍫</div>
      <p>Snacks</p>
    </div>
  </section>

  <!-- FEATURED PRODUCTS -->
  <div class="container">
    <h2 class="section-title">Featured <span>Products</span></h2>
    <div class="product-grid" id="product-grid"></div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
